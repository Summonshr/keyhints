<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KeyHints fixture</title>
<style>
  body { font: 14px sans-serif; margin: 30px 20px 20px; }
  .row { margin: 6px 0; }
  #card { cursor: pointer; padding: 4px; border: 1px solid #999; width: 200px; }
  #card span { cursor: pointer; }
  #modal { position: absolute; left: 0; top: 0; width: 300px; height: 30px; background: #eee; }
  #behind-wrap { position: relative; height: 30px; }
  #offscreen { position: absolute; top: 5000px; }
  #hidden-link { display: none; }
  #toplink { position: fixed; top: 0; right: 120px; }
  #panel { height: 50px; width: 220px; overflow: auto; border: 1px solid #aaa; display: inline-block; vertical-align: top; }
  #frm { width: 420px; height: 50px; border: 1px solid #aaa; }
</style>
</head>
<body>
  <a id="toplink" href="/top">Top link</a>
  <div class="row"><a id="link1" href="/page2">Go to page 2</a> <a id="link2" href="/page3">Page 3</a>
    <a id="link3" href="/page4"><span>Nested span link</span></a></div>
  <div class="row"><input id="text" type="text" value="abc"> <input id="email" type="email"></div>
  <div class="row"><textarea id="area" rows="1"></textarea>
    <div id="editor" contenteditable="true" style="display:inline-block">edit me</div>
    <select id="sel"><option>one</option><option>two</option></select></div>
  <div class="row"><button id="btn" onclick="window.clicked = (window.clicked || []).concat('btn')">Button</button>
    <input id="check" type="checkbox">
    <button id="refresh" onclick="window.clicked = (window.clicked || []).concat('refresh')">Show 35 posts</button>
    <button id="like1" data-testid="like">Like</button> <button id="like2" data-testid="like">Like</button>
    <button id="RANDOMID" data-t="rid" onclick="window.clicked = (window.clicked || []).concat('rid')">Stable action</button></div>
  <div class="row"><input type="checkbox" id="remember"><label for="remember">Remember me</label>
    <div role="button" id="ariadis" aria-disabled="true" style="display:inline-block">Dead button</div>
    <div id="wrap" tabindex="0" style="display:inline-block"><span id="ih">Inner handler</span></div>
    <button id="hovbtn">Menu</button><span id="menupanel" hidden>Menu item</span>
    <button id="mute" aria-label="Mute" onclick="this.setAttribute('aria-label', this.getAttribute('aria-label') === 'Mute' ? 'Unmute' : 'Mute')">🔈</button></div>
  <div class="row" id="card" onclick="window.clicked = (window.clicked || []).concat('card')"><span>Card (div with cursor:pointer)</span></div>
  <div class="row"><shadow-host id="sh"></shadow-host></div>
  <div class="row" id="behind-wrap"><button id="behind">Covered</button><div id="modal">modal on top</div></div>
  <div class="row"><div id="panel"><div style="height:600px">Scrollable panel content</div></div>
    <p id="para" style="display:inline-block;margin:0">Hello world from the KeyHints selection test.</p></div>
  <div class="row"><iframe id="frm" src="/frame"></iframe></div>
  <a id="offscreen" href="/off">Off screen</a>
  <a id="hidden-link" href="/hidden">Hidden</a>
  <button id="disabled" disabled>Disabled</button>
<script>
  // Track mousedown separately to prove SPA-style handlers fire.
  document.getElementById('btn').addEventListener('mousedown', () => { window.mousedown = true; });
  // Handler only on the inner span, not on the element that gets the hint.
  document.getElementById('ih').addEventListener('click', () => { window.clicked = (window.clicked || []).concat('inner-handler'); });
  // JS hover menu.
  document.getElementById('hovbtn').addEventListener('mouseenter', () => { document.getElementById('menupanel').hidden = false; });
  addEventListener('message', (e) => { window.frameMessages = (window.frameMessages || []).concat(e.data); });
  addEventListener('keydown', (e) => { if (e.ctrlKey) window.gotCtrl = true; });
  customElements.define('shadow-host', class extends HTMLElement {
    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<button id="inner">Shadow button</button>';
      root.querySelector('button').addEventListener('click', () => {
        window.clicked = (window.clicked || []).concat('shadow');
      });
    }
  });
</script>
</body>
</html>
